# ══════════════════════════════════════════════════════════════════════════════
# Edge Cases & Testing Scenarios
# ══════════════════════════════════════════════════════════════════════════════

edge_cases:
  
  vulnerability_trigger:
    id: "15"
    name: "[EDGE] Vulnerability Indicator"
    situation_id: "SIT-INV-001"
    segment_id: "SEG-INV-001"
    description: "Consumer with vulnerability flag should trigger HUMAN_REVIEW"
    bank_data:
      party_ref: "CUST-EDGE-001"
      savings_balance: 50000
      current_investments: false
      vulnerability_flag: true  # ← Triggers HUMAN_REVIEW
    expected_outcome: "HUMAN_REVIEW"
    rejection_reason: "PDC-003: Known unsuitability (vulnerability)"
  
  high_cost_debt:
    id: "16"
    name: "[EDGE] Active High-Cost Debt"
    situation_id: "SIT-INV-001"
    segment_id: "SEG-INV-001"
    description: "Consumer with high-cost debt excluded from investment TS"
    bank_data:
      party_ref: "CUST-EDGE-002"
      savings_balance: 30000
      current_investments: false
      high_cost_debt: true  # ← Excluding characteristic
    expected_outcome: "SUPPRESS"
    rejection_reason: "Excluding characteristic: high_cost_debt present"
  
  lump_sum_boundary:
    id: "17"
    name: "[EDGE] Lump Sum > £75k (Exit TS)"
    situation_id: "SIT-INV-004"
    segment_id: "SEG-INV-004"
    description: "Lump sum exceeds TS boundary, requires full advice"
    bank_data:
      party_ref: "CUST-EDGE-003"
      lump_sum_amount: 100000  # ← > £75k boundary
      current_investments: false
    expected_outcome: "SUPPRESS"
    rejection_reason: "Lump sum exceeds £75k threshold (exit TS)"
  
  low_ml_confidence:
    id: "18"
    name: "[EDGE] Low ML Confidence"
    situation_id: "SIT-INV-002"
    segment_id: "SEG-INV-002"
    description: "ML confidence below 95% threshold"
    bank_data:
      party_ref: "CUST-EDGE-004"
      age: 28
      # Minimal data = low confidence
    expected_outcome: "HUMAN_REVIEW"
    rejection_reason: "PDC-007: ML confidence below threshold"
  
  stale_data:
    id: "19"
    name: "[EDGE] Stale Bank Data"
    situation_id: "SIT-INV-001"
    segment_id: "SEG-INV-001"
    description: "Bank data older than 30 days"
    bank_data:
      party_ref: "CUST-EDGE-005"
      savings_balance: 40000
      data_age_days: 45  # ← Stale
      current_investments: false
    expected_outcome: "HUMAN_REVIEW"
    rejection_reason: "PDC-002: Data accuracy verification required"

