    trigger: "Firm initiative"
    bank_data:
      party_ref: "CUST-DEC-004"
      in_active_drawdown: true
      months_since_last_review: 22
      cash_drag_flag: true
      recent_adviser_interaction: false
      vulnerability_flag: false
