  - id: SEG-DEC-004
    version: "2.0"
    linked_situation: SIT-DEC-004
    label: "Existing Drawdown Member — Lapsed Engagement"

    including_characteristics:
      - id: IC-DEC-004-01
        label: "In drawdown"
        type: BOOLEAN
        definition: "Consumer is in active flexi-access drawdown with this firm"
        data_source: "Pension access status"

      - id: IC-DEC-004-02
        label: "No strategy review"
        type: TEMPORAL
        definition: "No drawdown strategy change, fund switch, or retirement review in ≥ 18 months"
        data_source: "Transaction and instruction history"

      - id: IC-DEC-004-03
        label: "Potential cash drag or withdrawal concern"
        type: [THRESHOLD, MODEL_OUTPUT]
        definition: >
          At least ONE of:
            (i)  Cash sub-account > 20% of total drawdown pot
            (ii) Annualised withdrawal rate > 6% of drawdown pot value
        data_source: "Fund allocation data; withdrawal history"

    excluding_characteristics:
      - id: EC-DEC-004-01
        label: "Active vulnerability flag"
        type: FLAG
        definition: "Active vulnerability marker"
        alternative_support:
          type: SPECIALIST_JOURNEY

      - id: EC-DEC-004-02
        label: "Recent independent advice"
        type: TEMPORAL
        definition: "Declared engagement with regulated adviser in past 12 months"
        rationale: "Consumer has appropriate support"
        alternative_support:
          type: NONE_REQUIRED

    assumptions_used:
      - id: ASM-DEC-004-01
        assumption: "Inactivity is disengagement, not a deliberate 'set and forget' strategy"
        materiality: LOW
        justification: >
          'Do nothing and confirm position' is valid suggestion output.
          Assumption does not affect suggestion suitability range.
        disclosure_to_consumer: OPTIONAL

    risk_questionnaire_permitted: false
    notes: >
      PS25/22 simplified monitoring: this is a one-off re-engagement prompt,
      NOT an ongoing managed drawdown service. Firm has no ongoing individual
      suitability monitoring obligation per final rules.

    data_accuracy_verification:
      method: "Live drawdown account data confirmed at journey initiation"

    granularity_assessment:
      verdict: SUFFICIENT
      rationale: "Active status + inactivity period + objective financial signal"

    segment_review_cadence: "Annually"
    linked_suggestion: SUG-DEC-004
