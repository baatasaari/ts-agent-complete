        definition: "Consumer has safeguarded benefits requiring independent advice (e.g. GMP)"
        rationale: "Specialist regulated advice mandatory"
        alternative_support:
          type: MANDATORY_REFERRAL
          destination: "Regulated pension transfer specialist"

      - id: EC-DEC-003-02
        label: "Active vulnerability flag"
