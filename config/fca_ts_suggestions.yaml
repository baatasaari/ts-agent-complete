  - id: SUG-SD-001
    version: "2.0"
    linked_segment: SEG-SD-001
    linked_situation: SIT-SD-001
    label: "Reinvest Your Maturing Deposit — Cash, Structured Deposit, or Investment"
    suggestion_type: MATURITY_REINVESTMENT_DIRECTION

    core_recommendation: >
      Your [product name] matures on [date].  You have three options to consider:
        Option A — Roll into a new fixed-rate deposit or structured deposit.
        Option B — Transfer into a Stocks and Shares ISA or investment fund.
        Option C — Move to an easy-access savings account temporarily while you decide.
      This suggestion presents these options and directs you to the most suitable
      starting point based on your profile.

    multiple_options:
      - option_id: OPT-SD-001-A
        label: "New fixed-rate deposit or structured deposit"
        description: "Maintain capital certainty; different rate/term available"
        in_scope: true
      - option_id: OPT-SD-001-B
        label: "Stocks and Shares ISA or investment fund"
        description: "Market-based potential growth; capital at risk; tax-efficient"
        in_scope: true
        sub_suggestion: SUG-INV-001
      - option_id: OPT-SD-001-C
        label: "Easy-access savings account (temporary)"
        description: "Hold while deciding; may be followed by further TS journey"
        in_scope: true
        note: "Guidance only; not a TS ready-made suggestion"

    mandatory_disclosures:
      - id: DISC-001
        type: SERVICE_LABEL
      - id: DISC-002
        type: NATURE_AND_LIMITATIONS
      - id: DISC-003
        type: SEGMENT_CHARACTERISTICS
        text: >
          You have been matched to this suggestion because: you hold a
          maturing deposit with us maturing within 60 days, and you have
          not placed a reinvestment instruction.
      - id: DISC-004
        type: CAPITAL_AT_RISK
        condition: "Required if investment option is included in suggestion"
      - id: DISC-005
        type: PRODUCT_SCOPE
      - id: DISC-006
        type: MONEYHELPER_SIGNPOST

    cobs_9b_suitability_basis: >
      Consumer holds a maturing deposit with no reinvestment plan.  Presenting
      structured reinvestment options (deposit, investment, easy-access) is
      suitable for all consumers in SEG-SD-001.  Options are mass-market;
      capital at risk is disclosed for investment option.

    monitoring_trigger:
      kpis:
        - "Option selection rate by type"
        - "Reinvestment completion rate within 30 days of maturity"
        - "Post-maturity complaint rate"

  # ────────────────────────────────────────────────────────────────────────────
  # DC PENSION ACCUMULATION SUGGESTIONS
  # ────────────────────────────────────────────────────────────────────────────

  - id: SUG-PEN-001
    version: "2.0"
    linked_segment: SEG-PEN-001
    linked_situation: SIT-PEN-001
    label: "Increase Your Pension Contribution Rate"
    suggestion_type: EXISTING_PRODUCT_ACTION_CONTRIBUTION_INCREASE

    core_recommendation: >
      Based on your pension pot and current contribution rate, your projected
      retirement income may be below a reasonable target.  Consider increasing
      your contribution rate by [X]% to improve your projected outcome —
      particularly if your employer will match any increase.

    better_position_rationale: >
      Consumers at or below the auto-enrolment minimum face a material
      retirement income shortfall.  Early contribution increases have a
      compounding effect far exceeding late-stage corrections.  A defined
      contribution rate increase puts the consumer in a materially better
      retirement position.

    product_details:
      action: "Increase employee pension contribution rate"
      suggested_increase_bands:
        - band_id: BAND-A
          from: "At/below AE minimum (≤ 8% combined)"
          to: "10% combined"
          employer_match_note: "Check if employer matches above minimum"
        - band_id: BAND-B
          from: "10% combined"
          to: "12% combined"
          employer_match_note: "Many schemes match up to 12–15% — check scheme rules"
      projection_display:
        type: STANDARDISED_ILLUSTRATION
        disclaimer: >
          This projection uses standardised assumptions.  It is not a
          personalised retirement forecast and is not guaranteed.
          Actual outcomes will depend on future investment performance,
          inflation, and your personal circumstances.
        assumptions_basis: "COBS illustration standards (standardised growth rates)"

    guidance_integral_to_suggestion:
      - topic: "How employer matching works and how to check the firm's scheme rules"
        type: INFORMATIONAL_GUIDANCE
        framework: WITHIN_TS_RULES
      - topic: "How pension tax relief works at basic rate"
        type: INFORMATIONAL_GUIDANCE
        framework: WITHIN_TS_RULES
        caveat: "Tax treatment depends on individual circumstances"

    mandatory_disclosures:
      - id: DISC-001
        type: SERVICE_LABEL
      - id: DISC-002
        type: NATURE_AND_LIMITATIONS
      - id: DISC-003
        type: SEGMENT_CHARACTERISTICS
        text: >
          You have been matched to this suggestion because: you are aged 25–57,
          your current pension contribution rate is at or below the auto-enrolment
          minimum, and your projected retirement income appears below a reasonable
          target based on standardised assumptions.
      - id: DISC-010
        type: PROJECTION_DISCLAIMER
        text: >
          Projections shown use standardised assumptions and are not
          personalised financial forecasts. Actual retirement income will vary.
      - id: DISC-011
        type: OTHER_PENSION_DISCLOSURE
        text: >
          This suggestion is based on the pension you hold with us.  If you
          have other pension savings elsewhere, your overall position may differ.
          Please consider all your pensions when making a decision.
      - id: DISC-006
        type: MONEYHELPER_SIGNPOST
        url: "https://www.moneyhelper.org.uk"
      - id: DISC-012
        type: PENSION_WISE_SIGNPOST
        text: >
          For free impartial pensions guidance, including on how to build up
          your pension, visit MoneyHelper / Pension Wise at moneyhelper.org.uk

    prohibited_extensions:
      - "MUST NOT suggest pension consolidation in connection with this suggestion"
      - "MUST NOT suggest specific fund changes alongside contribution increase without separate segment match"
      - "MUST NOT present projection as a personalised financial plan or guaranteed outcome"

    cobs_9b_suitability_basis: >
      Segment is working-age, at/below AE minimum, projected shortfall evident
      at segment level, not in hardship, not vulnerable.  Increasing contributions
      within the same existing scheme carries no product change risk.  Suitable
      for all correctly aligned consumers in SEG-PEN-001 under COBS 9B.

    cobs_4_communication_check: "Projection illustrations must comply with COBS illustration rules; not misleading"

    monitoring_trigger:
      kpis:
        - "Contribution increase take-up rate"
        - "12-month contribution retention rate"
        - "Segment-level projected income improvement post-suggestion"
        - "Complaint rate"

