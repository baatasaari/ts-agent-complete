    label: "Explore Annuity Options — Features and Comparison Referral"
    suggestion_type: ANNUITY_FEATURES_DIRECTION_AND_REFERRAL

    core_recommendation: >
      An annuity can provide a guaranteed income for life from your pension pot.
      Key features to consider include: income level, joint life vs single life,
      escalation (inflation-linking), and guaranteed periods.
      We recommend you compare options using the MoneyHelper annuity comparison
      tool before making any decision.

