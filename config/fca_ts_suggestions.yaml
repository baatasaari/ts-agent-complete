  - id: SUG-DEC-001
    version: "2.0"
    linked_segment: SEG-DEC-001
    linked_situation: SIT-DEC-001
    label: "Start Planning How You'll Access Your Pension"
    suggestion_type: DECUMULATION_PATHWAY_DIRECTION_AND_REFERRAL

    core_recommendation: >
      You are approaching retirement and have not yet chosen how to access
      your pension savings.  There are two main routes to consider:
        Pathway A — Drawdown: keep your pension invested and withdraw flexibly.
        Pathway B — Annuity: exchange your pension for a guaranteed income for life.
      We suggest you explore both options and book a free Pension Wise appointment
      before making any decision.

    multiple_options:
      - option_id: OPT-DEC-001-A
        label: "Explore income drawdown"
        description: >
          Pension remains invested; you choose how much and when to withdraw.
          Value can rise or fall. Potential for investment growth.
        action: "Direct to firm's drawdown illustration tool or drawdown initiation pathway"
        type: DIRECTIONAL_ONLY
        note: "Not a specific drawdown product recommendation — directional exploration only"
      - option_id: OPT-DEC-001-B
        label: "Explore annuity options"
        description: >
          Exchange pension pot for a guaranteed income for life.
          Amount depends on your pot size and market rates at the time.
        action: "Direct to MoneyHelper annuity comparison tool"
        moneyhelper_annuity_tool: MANDATORY
        whole_of_market_brokerage: >
          May be provided AFTER TS journey ends. See annuity_global_rules.
        specific_annuity_product: PROHIBITED
        quotation: PROHIBITED
      - option_id: OPT-DEC-001-C
        label: "Do nothing yet — book a Pension Wise appointment first"
        description: "Get free impartial guidance before deciding"
        action: "Signpost to Pension Wise booking"
        type: DO_NOTHING_SIGNPOST

    mandatory_disclosures:
      - id: DISC-001
        type: SERVICE_LABEL
      - id: DISC-002
        type: NATURE_AND_LIMITATIONS
      - id: DISC-003
        type: SEGMENT_CHARACTERISTICS
        text: >
          You have been matched to this suggestion because: you have a DC pension
          with us, you are aged 45–65, and you have not yet chosen how to access
          your pension savings.
      - id: DISC-004
        type: CAPITAL_AT_RISK
        text: "If you choose drawdown, the value of your pension can fall as well as rise."
      - id: DISC-014
        type: ANNUITY_IRREVOCABILITY
        text: "An annuity is an irreversible decision. Once purchased, it generally cannot be changed."
      - id: DISC-006
        type: MONEYHELPER_SIGNPOST
        url: "https://www.moneyhelper.org.uk"
      - id: DISC-012
        type: PENSION_WISE_SIGNPOST
        text: >
          We strongly recommend you speak to Pension Wise — a free, impartial
          government-backed guidance service — before making a final decision
          about how to access your pension. Book at moneyhelper.org.uk/pensionwise
        cobs_19_compliance: MANDATORY
      - id: DISC-015
        type: NO_CONSOLIDATION
        text: "This suggestion does not involve combining or moving any pension pots."

    prohibited_extensions:
      - "MUST NOT recommend a specific annuity product"
      - "MUST NOT provide an annuity quotation (including illustrative rates)"
      - "MUST NOT suggest pension consolidation"
      - "MUST NOT bypass Pension Wise signpost (COBS 19 mandatory)"
      - "MUST NOT present drawdown suggestion as guaranteed income"

    cobs_9b_suitability_basis: >
      Suggestion is directional (pathway exploration + Pension Wise referral),
      not a final product selection.  Consumer retains full decision-making
      responsibility after guidance.  Suitable for all consumers in SEG-DEC-001
      under COBS 9B.  No COBS 9/9A individual suitability required.

    cobs_19_compliance:
      pension_wise_signpost: MANDATORY
      timing: "Must be provided within or at conclusion of the TS suggestion"

    monitoring_trigger:
      kpis:
        - "Pension Wise referral take-up rate"
        - "Drawdown exploration initiation rate"
        - "Annuity tool click-through rate"
        - "Post-suggestion access decision rate at 12 months"
        - "Complaint rate"

