          age_range: "25–35"
          fund_type: "Higher growth equity-tilted fund"
          rationale: "Long accumulation horizon supports higher equity allocation"
          risk_category: HIGH_GROWTH
        - band: ACCUMULATION
          age_range: "36–50"
          fund_type: "Balanced multi-asset fund"
          rationale: "Medium horizon; moderate growth with diversification"
