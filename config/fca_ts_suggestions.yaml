      For your pension pot of [amount], the most accessible routes are:
        Option A — UFPLS: take one or more lump sums (25% tax-free, 75% taxed as income).
        Option B — Drawdown: move pot into drawdown; take 25% tax-free cash; draw flexibly.
      We suggest you book a free Pension Wise appointment before deciding.

    multiple_options:
      - option_id: OPT-DEC-002-A
        label: "Uncrystallised Fund Pension Lump Sum (UFPLS)"
        description: "Each withdrawal is 25% tax-free and 75% taxable income. Simple for small pots."
        in_scope: true
      - option_id: OPT-DEC-002-B
        label: "Flexi-access drawdown"
        description: "Crystallise; take 25% tax-free cash; draw flexibly. Pot remains invested."
        in_scope: true
      - option_id: OPT-DEC-002-C
        label: "Do nothing — book Pension Wise first"
        description: "Get free guidance before deciding"
