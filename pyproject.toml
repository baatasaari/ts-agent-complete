# ─────────────────────────────────────────────────────────────────────────────
# LBG Targeted Support Agent Platform  —  pyproject.toml
#
# Build backend: hatchling  (ships with uv — no separate Nexus download needed)
# Package manager: uv  (LBG-approved)
#
# Two install profiles:
#   uv sync                  → core + dev  (demo + tests, NO google-adk)
#   uv sync --extra adk      → adds google-adk for production ADK runner
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "ts-agent"
version     = "2.0.0"
description = "LBG Targeted Support Agent Platform — FCA PS25/22 compliant (v2, live 6 April 2026)"
requires-python = ">=3.12"

# ── Core runtime dependencies (demo + tests work with these alone) ────────────
dependencies = [
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "structlog>=24.4",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
# Dev tools — needed to run pytest
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
]

# Production ADK runner — only needed when running with a live Gemini LLM
# Not required for the demo or unit tests
adk = [
    "google-adk==1.31.1",
]

# ── Hatchling package discovery ───────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["ts_agent"]

# ── uv configuration ──────────────────────────────────────────────────────────
[dependency-groups]
# Tell uv which groups to install by default
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
]

# ── pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["."]
addopts      = "--cov=ts_agent --cov-report=term-missing --cov-fail-under=85 -v"
markers      = [
    "unit: fast, no I/O",
    "integration: requires Neo4j/Spanner stubs",
    "slow: long-running ML training tests",
]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["ts_agent"]
omit   = ["ts_agent/__init__.py", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
